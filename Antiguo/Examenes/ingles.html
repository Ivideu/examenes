<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGLISH EXAM - 1º ESO (Full Practice)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --english-blue: #002366;
            --english-red: #cf142b;
            --bg-gray: #f0f2f5;
            --success: #27ae60;
            --error: #c0392b;
        }

        body {
            background-color: var(--bg-gray);
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #quiz-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-left: 10px solid var(--english-blue);
            border-right: 10px solid var(--english-red);
        }

        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; color: var(--english-blue); margin-bottom: 10px; }
        
        .progress-bar { height: 10px; background: #e0e0e0; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--english-blue), var(--english-red)); transition: 0.4s; }

        .question-box { font-size: 1.25rem; font-weight: 800; margin-bottom: 20px; color: #333; }
        .tag-razonamiento { background: #f39c12; color: white; padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; margin-right: 10px; vertical-align: middle; }

        .options-grid { display: grid; gap: 10px; }
        .option-btn {
            background: #fff; border: 2px solid #ddd; padding: 15px;
            border-radius: 10px; cursor: pointer; font-size: 1.1rem; font-weight: 600;
            transition: 0.2s; text-align: left;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--english-blue); background: #f8f9ff; }

        #feedback {
            display: none; margin-top: 20px; padding: 15px; border-radius: 10px;
            text-align: center; font-weight: bold; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .correct-ans { background: #e8f5e9; color: var(--success); border: 1px solid var(--success); }
        .wrong-ans { background: #ffebee; color: var(--error); border: 1px solid var(--error); }

        .action-btn {
            margin-top: 15px; background: var(--english-blue); color: white;
            border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer;
            font-size: 1rem; font-weight: bold; width: 100%;
        }

        #final-screen { display: none; text-align: center; }
        .score-circle { font-size: 4rem; color: var(--english-red); font-weight: 800; margin: 20px 0; }
        .btn-back { background: #34495e; color: white; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; float: left; font-weight: bold; transition: 0.3s; margin-bottom: 10px; }
        .btn-back:hover { background: #2c3e50; transform: translateX(-3px); }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-ui">
        <div class="header">
             <button onclick="window.history.back()" class="btn-back">⬅ VOLVER</button>
            <h1>🇬🇧 ENGLISH EXAM - 1º ESO</h1>
            <div class="stats">
                <span id="current-q">Question: 1 / 40</span>
                <span id="current-score">Grade: 0.0</span>
            </div>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>

        <div id="question-area"></div>

        <div id="feedback">
            <p id="feedback-msg"></p>
            <button class="action-btn" onclick="nextQuestion()">NEXT QUESTION ➔</button>
        </div>
    </div>

    <div id="final-screen">
        <h2>EXAM COMPLETED!</h2>
        <div class="score-circle" id="final-grade">0.0</div>
        <p id="rank-message"></p>
        <button class="action-btn" onclick="location.reload()">RESTART EXAM</button>
    </div>
</div>

<script>
    const questions = [
        // BLOQUE 1
        { q: "There ____ a supermarket near my house.", opts: ["is", "are"], ans: 0, info: "Use 'is' for singular (a supermarket)." },
        { q: "There ____ three apples on the table.", opts: ["is", "are"], ans: 1, info: "Use 'are' for plural (three apples)." },
        { q: "I have ___ orange and ___ bananas.", opts: ["a / any", "an / some", "some / an"], ans: 1, info: "'An' for vowels (orange) and 'some' for plural affirmative." },
        { q: "There isn’t ___ milk in the fridge.", opts: ["some", "a", "any"], ans: 2, info: "Use 'any' for negative sentences with uncountable nouns." },
        { q: "__________ students are there in your class?", opts: ["How much", "How many", "How any"], ans: 1, info: "'How many' is used for countable nouns (students)." },
        { q: "My brother ______ (play) football every Saturday.", opts: ["play", "plays", "playing"], ans: 1, info: "Third person singular (he/she/it) adds -s in Present Simple." },
        { q: "We ______ (not like) fast food.", opts: ["not like", "doesn't like", "don't like"], ans: 2, info: "We use 'don't' for I/You/We/They." },
        { q: "[RAZONAMIENTO] Choose the correct rewrite: I am late for school. (never)", opts: ["I am late never for school.", "I never am late for school.", "I am never late for school."], ans: 2, info: "Adverbs of frequency go AFTER the verb 'to be'." },
        { q: "Look! She ____ a photo.", opts: ["takes", "is taking"], ans: 1, info: "The word 'Look!' indicates the action is happening now (Present Continuous)." },
        { q: "I usually ____ breakfast at 7:30.", opts: ["am having", "have"], ans: 1, info: "'Usually' indicates a habit (Present Simple)." },
        { q: "Yesterday we ______ (visit) our grandparents.", opts: ["visited", "visit", "visiting"], ans: 0, info: "Past Simple of a regular verb adds -ed." },
        { q: "He ______ (buy) a new jacket.", opts: ["buyed", "bought", "buy"], ans: 1, info: "'Buy' is an irregular verb: buy -> bought." },
        { q: "While I ______ (study), my phone rang.", opts: ["studied", "am studying", "was studying"], ans: 2, info: "Past Continuous for an action in progress interrupted by another." },
        { q: "They ______ (watch) TV when the lights went out.", opts: ["were watching", "was watching", "watched"], ans: 0, info: "Use 'were' for 'They' in Past Continuous." },
        { q: "We ______ (finish) the exam at 11.", opts: ["finished", "finishing", "was finish"], ans: 0, info: "Completed action in the past (Past Simple)." },
        { q: "I’m going to ______ (study) English.", opts: ["study", "studying", "studied"], ans: 0, info: "After 'going to', we use the infinitive verb." },
        { q: "Don’t worry, I ____ help you.", opts: ["will", "won’t"], ans: 0, info: "'Will' is used for offers and promises." },
        { q: "If it rains, we ______ (stay) at home.", opts: ["stay", "will stay", "stayed"], ans: 1, info: "First Conditional: If + Present, Will + Infinitive." },
        { q: "A very big animal that lives in the sea is a ______.", opts: ["Lion", "Whale", "Elephant"], ans: 1, info: "Whale (ballena) lives in the sea." },
        { q: "You can borrow books at the ______.", opts: ["Library", "Bookshop", "Museum"], ans: 0, info: "Library is where you borrow books, bookshop is where you buy them." },

        // BLOQUE 2
        { q: "There ____ two parks in my town.", opts: ["is", "are"], ans: 1, info: "Plural nouns (two parks) use 'are'." },
        { q: "There ____ a cinema near here.", opts: ["is", "are"], ans: 0, info: "Singular nouns (a cinema) use 'is'." },
        { q: "She has ___ apple and ___ biscuits.", opts: ["an / some", "a / any", "some / an"], ans: 0, info: "'An' before vowel sounds, 'some' for plural affirmative." },
        { q: "There aren’t ___ eggs.", opts: ["some", "any", "a"], ans: 1, info: "Use 'any' for plural negative sentences." },
        { q: "__________ milk is there?", opts: ["How many", "How much", "How any"], ans: 1, info: "'How much' is used for uncountable nouns like milk." },
        { q: "She ______ (play) the piano.", opts: ["play", "plays", "playing"], ans: 1, info: "Third person singular adds -s." },
        { q: "He ______ (not go) to school on Sunday.", opts: ["don't go", "doesn't go", "not goes"], ans: 1, info: "He/She/It uses 'doesn't' for negatives." },
        { q: "[RAZONAMIENTO] Rewrite: She is tired. (always)", opts: ["She always is tired.", "She is always tired.", "Always she is tired."], ans: 1, info: "Frequency adverbs go after 'to be'." },
        { q: "Listen! They ____ music.", opts: ["listen", "are listening"], ans: 1, info: "'Listen!' means it's happening now (Continuous)." },
        { q: "He usually ____ to bed at 10.", opts: ["goes", "is going"], ans: 0, info: "Routine (Present Simple)." },
        { q: "Last week we ______ (travel) to Madrid.", opts: ["traveled", "travelled", "travel"], ans: 1, info: "Double 'l' in British English (travelled)." },
        { q: "She ______ (see) a film.", opts: ["seed", "saw", "seen"], ans: 1, info: "Irregular verb: see -> saw." },
        { q: "I ______ (do) homework when you called.", opts: ["was doing", "did", "am doing"], ans: 0, info: "Past Continuous (was + -ing)." },
        { q: "They ______ (sleep) when the alarm rang.", opts: ["was sleeping", "were sleeping", "slept"], ans: 1, info: "They + were + -ing." },
        { q: "We ______ (arrive) late.", opts: ["arrived", "arrive", "was arrive"], ans: 0, info: "Regular past verb." },
        { q: "She is going to ______ (visit) her cousin.", opts: ["visits", "visit", "visiting"], ans: 1, info: "Infinitive after 'going to'." },
        { q: "I think it ____ rain tomorrow.", opts: ["will", "won’t"], ans: 0, info: "Predictions with 'I think' use 'will'." },
        { q: "If I study, I ______ (pass) the exam.", opts: ["pass", "will pass", "passed"], ans: 1, info: "First Conditional: If + Present, Future (will)." },
        { q: "A person who works in a hospital is a ______.", opts: ["Teacher", "Doctor", "Firefighter"], ans: 1, info: "Doctors work in hospitals." },
        { q: "You sleep in the ______.", opts: ["Kitchen", "Bathroom", "Bedroom"], ans: 2, info: "Bedroom (dormitorio) is where you sleep." }
    ];

    let current = 0;
    let score = 0;
    const totalQ = questions.length;

    function renderQuestion() {
        const data = questions[current];
        const area = document.getElementById('question-area');
        document.getElementById('current-q').innerText = `Question: ${current + 1} / ${totalQ}`;
        document.getElementById('progress-fill').style.width = `${(current / totalQ) * 100}%`;
        document.getElementById('feedback').style.display = 'none';

        let qText = data.q.includes('[RAZONAMIENTO]') 
            ? `<span class="tag-razonamiento">LOGIC</span>` + data.q.replace('[RAZONAMIENTO]', '')
            : data.q;

        area.innerHTML = `<div class="question-box">${qText}</div><div class="options-grid" id="opts"></div>`;
        
        data.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = o;
            b.onclick = () => checkAnswer(i);
            document.getElementById('opts').appendChild(b);
        });
    }

    function checkAnswer(idx) {
        const data = questions[current];
        const f = document.getElementById('feedback');
        const msg = document.getElementById('feedback-msg');
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);

        if(idx === data.ans) {
            score += (10 / totalQ);
            f.className = 'correct-ans';
            msg.innerHTML = `EXCELLENT! 🌟<br>${data.info}`;
        } else {
            f.className = 'wrong-ans';
            msg.innerHTML = `Ouch! The correct answer was: "${data.opts[data.ans]}"<br>${data.info}`;
        }
        f.style.display = 'block';
        document.getElementById('current-score').innerText = `Grade: ${score.toFixed(1)}`;
    }

    function nextQuestion() {
        current++;
        if(current < totalQ) {
            renderQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('final-screen').style.display = 'block';
        let final = score.toFixed(1);
        if (final > 10) final = 10;
        document.getElementById('final-grade').innerText = final;
        
        const msg = document.getElementById('rank-message');
        if(final >= 9) msg.innerText = "AMAZING! You are a master of English!";
        else if(final >= 5) msg.innerText = "GOOD JOB! You passed, but keep practicing.";
        else msg.innerText = "KEEP TRYING! You need to review the grammar units.";
    }

    renderQuestion();
</script>
</body>
</html>
