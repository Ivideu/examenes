<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNIDAD 5: REINO PLANTAE - EXAMEN FINAL</title>
    <style>
        :root { --p: #2e7d32; --s: #81c784; --bg: #f1f8e9; --txt: #1b5e20; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        #container { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid var(--p); }
        .q-card { margin-bottom: 20px; }
        .tag { display: inline-block; background: #ffeb3b; color: #555; padding: 4px 8px; border-radius: 5px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
        .btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; cursor: pointer; background: none; transition: 0.3s; font-size: 1.05em; font-weight: 500; }
        .btn:hover { border-color: var(--s); background: #f9fdf9; }
        #feedback { display: none; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: center; font-weight: bold; font-size: 1.1em; }
        .correct { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
        .wrong { background: #ffebee; color: #c62828; border: 2px solid #c62828; }
        .next { background: var(--p); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 1.1em; font-weight: bold; }
        h1 { color: var(--p); text-align: center; }
        .progress { height: 12px; background: #eee; border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
        #bar { height: 100%; background: var(--p); width: 0%; transition: 0.5s; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; color: var(--p); margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="container">
    <h1>🌱 Unidad 5: Las Plantas</h1>
    <div class="stats">
        <span id="q-count">Pregunta: 1 / 20</span>
        <span id="score-count">Nota: 0.0</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    
    <div id="game">
        <div id="question-area"></div>
        <div id="feedback">
            <p id="f-msg"></p>
            <button class="next" onclick="next()">Siguiente Pregunta ➔</button>
        </div>
    </div>
    
    <div id="result" style="display:none; text-align: center;">
        <h2 id="final-score" style="font-size: 2.5em; color: var(--p);"></h2>
        <p id="final-msg" style="font-size: 1.2em;"></p>
        <button class="next" onclick="location.reload()">Repasar de nuevo</button>
    </div>
</div>

<script>
    const bank = [
        { q: "<span class='tag'>CLASIFICACIÓN</span> Un Pino silvestre es:", opts: ["Reino Plantae. Angiosperma dicotiledónea.", "Reino Plantae. Gimnosperma.", "Reino Plantae. Angiosperma monocotiledónea.", "Reino Plantae. Briófito."], ans: 1, info: "Los pinos tienen semillas desnudas agrupadas en piñas, son Gimnospermas." },
        { q: "<span class='tag'>CLASIFICACIÓN</span> Una planta de Trigo (cereal) es:", opts: ["Reino Plantae. Angiosperma monocotiledónea.", "Reino Plantae. Gimnosperma.", "Reino Plantae. Angiosperma dicotiledónea.", "Reino Plantae. Pteridófito."], ans: 0, info: "Los cereales y pastos son angiospermas monocotiledóneas (un solo cotiledón)." },
        { q: "<span class='tag'>CLASIFICACIÓN</span> Un Manzano es:", opts: ["Reino Plantae. Gimnosperma.", "Reino Plantae. Angiosperma monocotiledónea.", "Reino Plantae. Angiosperma dicotiledónea.", "Reino Plantae. Briófito."], ans: 2, info: "Tienen fruto carnoso y semillas con dos cotiledones." },
        { q: "<span class='tag'>RAZONAMIENTO</span> Si observas una hoja y ves que sus nervios son paralelos entre sí (como en una cinta), deduces que es:", opts: ["Gimnosperma", "Angiosperma Dicotiledónea", "Angiosperma Monocotiledónea", "Un helecho"], ans: 2, info: "Las nerviaciones paralelas son típicas de las monocotiledóneas." },
        { q: "<span class='tag'>COMPLETAR TEXTO</span> Las plantas con flores cuyas piezas florales se agrupan en múltiplos de 4 o 5 son las ____________.", opts: ["Gimnospermas", "Dicotiledóneas", "Monocotiledóneas", "Criptógamas"], ans: 1, info: "Las dicotiledóneas suelen tener 4 o 5 pétalos, mientras que las monocotiledóneas tienen 3 o múltiplos de 3." },
        { q: "<span class='tag'>TEORÍA</span> ¿Qué diferencia principal hay entre Gimnospermas y Angiospermas?", opts: ["Las gimnospermas no hacen fotosíntesis.", "Las angiospermas tienen la semilla protegida por un fruto.", "Las gimnospermas tienen fruto carnoso.", "Las angiospermas no tienen vasos conductores."], ans: 1, info: "Angiosperma significa 'semilla envasada' (dentro del ovario que formará el fruto)." },
        { q: "<span class='tag'>COMPLETAR TEXTO</span> Los falsos frutos de las gimnospermas (donde se alojan los piñones) se denominan ____________.", opts: ["Estróbilos o piñas", "Cápsulas", "Bulbos", "Esporangios"], ans: 0, info: "Son agrupaciones de brácteas que protegen la semilla desnuda." },
        { q: "<span class='tag'>RAZONAMIENTO</span> ¿Por qué decimos que los musgos (Briófitos) necesitan vivir en lugares muy húmedos?", opts: ["Porque sus raíces son muy profundas.", "Porque carecen de verdaderos vasos conductores para transportar el agua.", "Porque no pueden hacer la fotosíntesis con sol directo.", "Porque se alimentan de algas."], ans: 1, info: "Al no tener xilema ni floema desarrollados, absorben la humedad directamente por todo su cuerpo." },
        { q: "<span class='tag'>TEORÍA</span> ¿Cómo se llaman los pequeños bultos en el envés de las hojas de los helechos donde se guardan las esporas?", opts: ["Soros", "Estomas", "Cotiledones", "Ovarios"], ans: 0, info: "Los soros agrupan los esporangios que liberan las esporas para la reproducción." },
        { q: "<span class='tag'>TEORÍA</span> El tejido conductor que transporta la Savia Bruta (agua y sales) desde la raíz a las hojas es el:", opts: ["Floema", "Xilema", "Cloroplasto", "Estoma"], ans: 1, info: "El xilema (o vasos leñosos) transporta en sentido ascendente." },
        { q: "<span class='tag'>TEORÍA</span> El tejido conductor que reparte la Savia Elaborada (materia orgánica) por toda la planta es el:", opts: ["Xilema", "Floema", "Tubérculo", "Estambre"], ans: 1, info: "El floema (o vasos liberianos) distribuye el alimento tras la fotosíntesis." },
        { q: "<span class='tag'>RAZONAMIENTO</span> Si una planta cierra sus estomas, ¿qué proceso se ve directamente interrumpido?", opts: ["La absorción de agua por la raíz.", "El intercambio de gases (CO2 y O2) con el exterior.", "El crecimiento del tallo.", "La producción de savia bruta."], ans: 1, info: "Los estomas son los poros de las hojas por donde la planta 'respira' y transpira." },
        { q: "<span class='tag'>COMPLETAR TEXTO</span> La fotosíntesis se realiza principalmente en unos orgánulos celulares llamados ____________, que contienen clorofila.", opts: ["Mitocondrias", "Vacuolas", "Cloroplastos", "Núcleos"], ans: 2, info: "La clorofila es el pigmento verde que capta la energía solar." },
        { q: "<span class='tag'>RAZONAMIENTO</span> El crecimiento del tallo de una planta hacia la luz de una ventana es un ejemplo de:", opts: ["Geotropismo positivo", "Fototropismo positivo", "Tigmotropismo", "Fotonastia"], ans: 1, info: "Es un tropismo (movimiento permanente de crecimiento) provocado por la luz (foto)." },
        { q: "<span class='tag'>RAZONAMIENTO</span> El cierre rápido de las hojas de una planta atrapamoscas al ser tocada es:", opts: ["Un tropismo", "Una sismonastia", "Una polinización", "Un geotropismo"], ans: 1, info: "Las nastias son movimientos rápidos, temporales y reversibles." },
        { q: "<span class='tag'>TEORÍA</span> El órgano reproductor masculino de la flor (Androceo) está formado por:", opts: ["El pistilo y el ovario", "Los pétalos y sépalos", "Los estambres (filamento y antera)", "El estigma y el estilo"], ans: 2, info: "En las anteras de los estambres es donde se producen los granos de polen." },
        { q: "<span class='tag'>TEORÍA</span> Tras la fecundación de la flor, ¿en qué se transforma el OVARIO?", opts: ["En la semilla", "En el tallo", "En el fruto", "En el polen"], ans: 2, info: "El ovario engrosa y se convierte en fruto, mientras que los óvulos de su interior se convierten en semillas." },
        { q: "<span class='tag'>COMPLETAR TEXTO</span> El transporte del grano de polen desde la antera hasta el estigma del pistilo se llama ____________.", opts: ["Germinación", "Polinización", "Fecundación", "Dispersión"], ans: 1, info: "Puede ser anemógama (por viento) o entomógama (por insectos)." },
        { q: "<span class='tag'>RAZONAMIENTO</span> Una patata es un tallo subterráneo engrosado lleno de reservas que puede generar una nueva planta. Es un:", opts: ["Bulbo", "Tubérculo", "Estolón", "Rizoma"], ans: 1, info: "Es un tubérculo, una forma de reproducción asexual de las plantas." },
        { q: "<span class='tag'>TEORÍA</span> La parte exterior de la flor que protege el capullo, formada por hojitas verdes llamadas sépalos, es el:", opts: ["Cáliz", "Corola", "Androceo", "Gineceo"], ans: 0, info: "El cáliz protege la flor antes de abrirse; la corola está formada por los pétalos." }
    ];

    let cur = 0, score = 0;
    
    function render() {
        const d = bank[cur];
        document.getElementById('q-count').innerText = `Pregunta: ${cur + 1} / 20`;
        document.getElementById('bar').style.width = ((cur)/bank.length)*100 + "%";
        
        let html = `<div class="q-card"><h3>${d.q}</h3>`;
        d.opts.forEach((o, i) => html += `<button class="btn" onclick="check(${i})">${o}</button>`);
        document.getElementById('question-area').innerHTML = html;
        document.getElementById('feedback').style.display = 'none';
    }
    
    window.check = (i) => {
        const d = bank[cur];
        const f = document.getElementById('feedback');
        if(i === d.ans) { 
            score += 0.5; 
            f.className = "correct"; 
            f.innerHTML = "¡CORRECTO! 🌿<br><br><span style='font-weight:normal'>" + d.info + "</span>"; 
        } else { 
            f.className = "wrong"; 
            f.innerHTML = "INCORRECTO 🍂<br><br>La respuesta correcta era: <b>" + d.opts[d.ans] + "</b>.<br><span style='font-weight:normal'>" + d.info + "</span>"; 
        }
        f.style.display = "block";
        document.getElementById('score-count').innerText = `Nota: ${score.toFixed(1)}`;
        Array.from(document.getElementsByClassName('btn')).forEach(b => b.disabled = true);
    };
    
    window.next = () => {
        cur++;
        if(cur < bank.length) render();
        else {
            document.getElementById('game').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('bar').style.width = "100%";
            let final = score.toFixed(1);
            document.getElementById('final-score').innerText = final;
            document.getElementById('final-msg').innerText = final >= 5 ? "¡Enhorabuena! Tienes el Reino Plantae dominado." : "Hay que repasar un poco más. ¡Vuelve a intentarlo!";
        }
    };
    render();
</script>
</body>
</html>
