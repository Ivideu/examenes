<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Final Lengua 1º ESO - Unidades 5 y 6</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #2c3e50;
            --success: #27ae60;
            --error: #e74c3c;
            --warning: #f1c40f;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            color: var(--secondary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 4px solid var(--primary);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--light);
            padding: 15px 25px;
            border-radius: 50px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .question-container {
            min-height: 300px;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2px solid #dee2e6;
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            text-align: left;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }

        .option-btn.wrong {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }

        #feedback-area {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .next-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }

        #results-screen {
            text-align: center;
            display: none;
        }

        .final-score {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <header>
            <h1>🎓 Examen de Lengua Española</h1>
            <p>1º ESO - Unidades 5 y 6</p>
        </header>

        <div class="stats-bar">
            <span>Pregunta: <span id="current-q-num">1</span> / 40</span>
            <span id="score-display">Puntos: 0</span>
        </div>

        <div class="question-container">
            <div id="question-text" class="question-text"> Cargando pregunta...</div>
            <div id="options-grid" class="options-grid"></div>
            
            <div id="feedback-area">
                <strong id="feedback-title"></strong>
                <p id="feedback-text"></p>
                <button onclick="nextQuestion()" class="next-btn">Siguiente pregunta ➔</button>
            </div>
        </div>
    </div>

    <div id="results-screen">
        <h2>¡Examen Completado!</h2>
        <div class="final-score" id="final-score-val">0</div>
        <p id="performance-msg"></p>
        <button onclick="location.reload()" class="next-btn">Repetir examen (Nuevas preguntas)</button>
    </div>
</div>

<script>
    // BANCO DE PREGUNTAS (50 preguntas para seleccionar 40)
    const masterBank = [
        // Unidad 5: Verbos
        { q: "¿Cuál es el infinitivo del verbo 'yendo'?", opts: ["Yender", "Ir", "Iendo", "Yendo"], ans: 1, info: "Ir es un verbo altamente irregular; su gerundio es 'yendo'." },
        { q: "En la oración 'La cena fue preparada por mi abuelo', el verbo está en:", opts: ["Voz activa", "Voz pasiva", "Voz reflexiva", "Voz media"], ans: 1, info: "Es voz pasiva porque el sujeto (la cena) recibe la acción y aparece el verbo 'ser' + participio." },
        { q: "¿Cuál de estos verbos es defectivo?", opts: ["Comer", "Llover", "Cantar", "Sentir"], ans: 1, info: "Llover es defectivo porque solo se puede conjugar en 3ª persona del singular (fenómeno natural)." },
        { q: "Identifica la forma no personal: 'Amado'", opts: ["Infinitivo", "Gerundio", "Participio", "Presente"], ans: 2, info: "Los participios terminan en -ado o -ido." },
        { q: "Los verbos irregulares son aquellos que...", opts: ["Cambian la raíz o las desinencias respecto al modelo", "No tienen infinitivo", "Solo tienen formas en plural", "Terminan siempre en -er"], ans: 0, info: "La irregularidad se nota cuando la raíz cambia (ej: volar -> vuelo) o la terminación no sigue al modelo." },
        { q: "¿Cuál es el participio del verbo 'escribir'?", opts: ["Escribido", "Escrito", "Escribiendo", "Escriba"], ans: 1, info: "Es un participio irregular. No se dice 'escribido', sino 'escrito'." },
        { q: "El gerundio expresa...", opts: ["Una acción terminada", "El nombre de la acción", "Una acción en desarrollo", "Un ruego"], ans: 2, info: "El gerundio (-ando, -endo) indica que la acción está ocurriendo." },
        { q: "Vuelve esta frase a voz activa: 'El gol fue marcado por Messi'.", opts: ["Messi marcará un gol", "Messi marca el gol", "Messi marcó el gol", "Messi había marcado el gol"], ans: 2, info: "El complemento agente (Messi) pasa a ser sujeto y el verbo pasa de pasivo a activo manteniendo el tiempo (pasado)." },
        { q: "¿Qué caracteriza a una narración no literaria?", opts: ["El uso de mucha fantasía", "Su objetivo es informar de hechos reales", "Siempre rima", "No tiene autor"], ans: 1, info: "Las narraciones no literarias (noticias, crónicas) buscan la objetividad y la información real." },
        { q: "Verdadero o Falso: 'Haber' es un verbo impersonal cuando indica existencia.", opts: ["Verdadero", "Falso"], ans: 0, info: "Cierto. Se dice 'Había muchas personas', nunca 'Habían muchas personas'." },
        
        // Unidad 6: Adjetivos y otros
        { q: "¿Cuál es el grado del adjetivo en: 'Este libro es divertidísimo'?", opts: ["Positivo", "Comparativo de superioridad", "Superlativo absoluto", "Superlativo relativo"], ans: 2, info: "El sufijo -ísimo indica grado superlativo absoluto (máximo nivel)." },
        { q: "Señala el adjetivo en grado comparativo de inferioridad:", opts: ["Menos alto que", "Tan alto como", "Más alto que", "Altísimo"], ans: 0, info: "Se usa la estructura 'menos + adjetivo + que'." },
        { q: "¿Cuál es el comparativo irregular de 'bueno'?", opts: ["Buenísimo", "Más bueno", "Mejor", "Óptimo"], ans: 2, info: "Bueno -> Mejor (comparativo) -> Óptimo (superlativo)." },
        { q: "¿A qué sustantivo complementa 'que lleva gafas' en 'El chico que lleva gafas es mi primo'?", opts: ["Chico", "Gafas", "Primo", "Lleva"], ans: 0, info: "Es una oración de relativo que aporta información sobre el sustantivo 'chico'." },
        { q: "En la descripción objetiva...", opts: ["El autor da su opinión", "Se usan muchos sentimientos", "Se reflejan las cosas como son en realidad", "Se usa mucho el lenguaje poético"], ans: 2, info: "La descripción objetiva busca la precisión y la realidad, sin valoraciones personales." },
        { q: "El adjetivo 'paupérrimo' es el superlativo de:", opts: ["Pobre", "Pequeño", "Malo", "Bueno"], ans: 0, info: "Pobre tiene el superlativo irregular paupérrimo." },
        { q: "Un adjetivo calificativo sirve para:", opts: ["Indicar cantidad", "Expresar una cualidad del sustantivo", "Sustituir al nombre", "Unir oraciones"], ans: 1, info: "Su función principal es decir cómo es o cómo está el sustantivo." },
        { q: "¿Cuál es el género y número de 'felices'?", opts: ["Masculino plural", "Femenino plural", "Neutro singular", "Género común, plural"], ans: 3, info: "Feliz es un adjetivo de una sola terminación para el género (el niño feliz / la niña feliz)." },
        { q: "En 'la mesa de madera', 'de madera' es:", opts: ["Un adjetivo calificativo", "Un complemento preposicional", "Un relativo", "Un determinante"], ans: 1, info: "Es un grupo de palabras introducido por una preposición que complementa al nombre." },
        { q: "El grado superlativo de 'malo' es:", opts: ["Malísimo", "Peor", "Pésimo", "Las opciones A y C son correctas"], ans: 3, info: "Tanto malísimo (regular) como pésimo (irregular) son grados superlativos." },

        // Más preguntas para llegar al banco amplio...
        { q: "¿Qué modo verbal usamos para dar órdenes?", opts: ["Indicativo", "Subjuntivo", "Imperativo", "Gerundio"], ans: 2, info: "El imperativo sirve para mandatos, ruegos o deseos directos." },
        { q: "¿Cuál es la raíz del verbo 'Cantaremos'?", opts: ["Cantar", "Cant", "Cantare", "Canta"], ans: 1, info: "La raíz se obtiene quitando la terminación -ar, -er, -ir al infinitivo." },
        { q: "Identifica la oración en voz activa:", opts: ["El fuego fue apagado", "Los bomberos apagaron el fuego", "El fuego se apagó", "El fuego había sido apagado"], ans: 1, info: "El sujeto (bomberos) realiza la acción directamente." },
        { q: "¿Cómo se llama la descripción de una persona por sus rasgos físicos?", opts: ["Etopeya", "Retrato", "Prosopografía", "Caricatura"], ans: 2, info: "La prosopografía se centra exclusivamente en el aspecto físico." },
        { q: "El grado positivo del adjetivo...", opts: ["Compara dos cosas", "Indica la cualidad sin intensidad", "Indica la cualidad máxima", "No existe"], ans: 1, info: "El grado positivo simplemente nombra la cualidad (ej: casa grande)." },
        { q: "Identifica el participio que funciona como adjetivo:", opts: ["He comido", "La puerta abierta", "Estoy saltando", "Quiero salir"], ans: 1, info: "'Abierta' es un participio que aquí funciona como adjetivo de 'puerta'." },
        { q: "¿Qué es un verbo defectivo?", opts: ["Un verbo que no se usa", "Un verbo que carece de algunas formas en su conjugación", "Un verbo que siempre es irregular", "Un verbo que termina en -ir"], ans: 1, info: "Les faltan tiempos o personas (como 'acaecer' o 'soler')." },
        { q: "En 'Ese coche es más rápido que el mío', el grado es:", opts: ["Superioridad", "Igualdad", "Inferioridad", "Absoluto"], ans: 0, info: "Estructura 'más... que'." },
        { q: "La descripción de los rasgos psicológicos de una persona es:", opts: ["Prosopografía", "Etopeya", "Retrato", "Paisaje"], ans: 1, info: "La etopeya describe el carácter, valores y forma de ser." },
        { q: "Señala la forma personal (conjugada):", opts: ["Vivir", "Viviendo", "Vivía", "Vivido"], ans: 2, info: "Vivía tiene persona (yo/él), tiempo y modo. Las otras son formas no personales." },
        { q: "El superlativo de 'célebre' es:", opts: ["Celebrísimo", "Celebérrimo", "Muy célebre", "B y C son correctas"], ans: 3, info: "Celebérrimo es la forma culta e irregular." },
        { q: "En 'El hombre que fuma es mi tío', ¿cuál es el relativo?", opts: ["El", "que", "fuma", "mi"], ans: 1, info: "'que' es el pronombre relativo que introduce la oración." },
        { q: "Un adjetivo de dos terminaciones es aquel que...", opts: ["Tiene forma distinta para masculino y femenino", "Termina siempre en -e", "Sirve para plural y singular", "No existe"], ans: 0, info: "Ej: blanco / blanca. Cambian según el género." },
        { q: "¿Cuál es el infinitivo de 'supuesto'?", opts: ["Suponer", "Suponiendo", "Supuestar", "Saber"], ans: 0, info: "Supuesto es el participio irregular de suponer." },
        { q: "Los textos descriptivos en 1º de ESO suelen usar muchos:", opts: ["Verbos de acción", "Adjetivos", "Adverbios de tiempo", "Interjecciones"], ans: 1, info: "Los adjetivos son la herramienta principal para pintar con palabras." },
        { q: "La voz pasiva se construye con el verbo auxiliar:", opts: ["Haber", "Estar", "Ser", "Tener"], ans: 2, info: "Siempre se usa el verbo SER (ej: Es amado, fue visto)." },
        { q: "Verdadero o Falso: 'Soler' solo se usa en presente y pretérito imperfecto.", opts: ["Verdadero", "Falso"], ans: 0, info: "Correcto, es un verbo defectivo por su uso temporal." },
        { q: "El superlativo absoluto de 'fiel' es:", opts: ["Fielísimo", "Fidelísimo", "Muy fiel", "B y C son correctas"], ans: 3, info: "Fidelísimo es la forma irregular correcta del latín fidelis." },
        { q: "¿Qué aporta el complemento preposicional?", opts: ["Una acción", "Una característica del sustantivo mediante preposición", "Indica el tiempo", "Sustituye al nombre"], ans: 1, info: "Ej: 'Café con leche'. 'Con leche' especifica el tipo de café." },
        { q: "El grado comparativo de igualdad usa la estructura:", opts: ["Más... que", "Menos... que", "Tan... como", "Muy..."], ans: 2, info: "Ej: Tan alto como tú." },
        { q: "¿Cuál es el gerundio de 'leer'?", opts: ["Leido", "Leendo", "Leyendo", "Leerá"], ans: 2, info: "Al estar entre vocales, la 'i' se convierte en 'y': leyendo." },
        { q: "La narración literaria busca...", opts: ["Solo informar", "Entretener y crear arte con el lenguaje", "Vender un producto", "Dar instrucciones"], ans: 1, info: "Usa recursos expresivos para emocionar o entretener." },
        { q: "Grado superlativo absoluto de 'antiguo':", opts: ["Antigüísimo", "Antiquísimo", "Muy antiguo", "B y C son correctas"], ans: 3, info: "Antiquísimo es la forma culta." },
        { q: "En 'libro cerrado', 'cerrado' es un:", opts: ["Gerundio", "Participio", "Infinitivo", "Adverbio"], ans: 1, info: "Funciona como adjetivo." },
        { q: "Los adjetivos 'comparativos sintéticos' son:", opts: ["Más grande, más pequeño", "Mayor, menor, mejor, peor", "Grande, pequeño", "Máximo, mínimo"], ans: 1, info: "Se llaman sintéticos porque en una sola palabra incluyen el significado de 'más bueno' o 'más malo'." },
        { q: "En la descripción de un paisaje usamos el orden:", opts: ["De lo general a lo particular", "De arriba a abajo", "De izquierda a derecha", "Cualquiera de los anteriores"], ans: 3, info: "Lo importante es seguir un orden lógico para que el lector lo imagine." },
        { q: "Un verbo es una palabra que expresa...", opts: ["Cualidades", "Nombres", "Acciones, estados o procesos", "Cantidades"], ans: 2, info: "Definición básica del verbo." },
        { q: "El adjetivo 'mísero' tiene como superlativo:", opts: ["Miserísimo", "Misérrimo", "Muy mísero", "Las opciones B y C son correctas"], ans: 3, info: "Como paupérrimo o celebérrimo, usa la terminación -érrimo." },
        { q: "¿Qué es un retrato?", opts: ["Descripción de un animal", "Descripción física y psicológica de una persona", "Un cuadro sin texto", "Descripción de un objeto"], ans: 1, info: "Combina prosopografía y etopeya." },
        { q: "Para que un adjetivo concuerde con el sustantivo debe tener igual:", opts: ["Género y número", "Persona y tiempo", "Significado", "Longitud"], ans: 0, info: "Si el sustantivo es femenino plural, el adjetivo también (ej: niñas altas)." }
    ];

    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;

    function initQuiz() {
        // Mezclamos el banco y tomamos 40
        currentQuestions = masterBank.sort(() => Math.random() - 0.5).slice(0, 40);
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIdx];
        document.getElementById('current-q-num').innerText = currentIdx + 1;
        document.getElementById('question-text').innerText = q.q;
        
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        
        document.getElementById('feedback-area').style.display = 'none';

        q.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index, btn);
            grid.appendChild(btn);
        });
    }

    function selectOption(index, btn) {
        const q = currentQuestions[currentIdx];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const feedbackArea = document.getElementById('feedback-area');
        const fTitle = document.getElementById('feedback-title');
        const fText = document.getElementById('feedback-text');

        if(index === q.ans) {
            btn.classList.add('correct');
            score++;
            fTitle.innerText = "¡CORRECTO! ✨";
            fTitle.style.color = "var(--success)";
            feedbackArea.style.borderLeft = "6px solid var(--success)";
            document.getElementById('score-display').innerText = "Puntos: " + score;
        } else {
            btn.classList.add('wrong');
            allBtns[q.ans].classList.add('correct');
            fTitle.innerText = "INCORRECTO ❌";
            fTitle.style.color = "var(--error)";
            feedbackArea.style.borderLeft = "6px solid var(--error)";
        }

        fText.innerText = q.info;
        feedbackArea.style.display = 'block';
        feedbackArea.style.backgroundColor = "#fdfdfd";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < 40) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        const resultScreen = document.getElementById('results-screen');
        resultScreen.display = 'block';
        document.getElementById('results-screen').style.display = 'block';
        
        const finalVal = document.getElementById('final-score-val');
        finalVal.innerText = score + " / 40";
        
        const msg = document.getElementById('performance-msg');
        const nota = (score / 40) * 10;
        
        if(nota >= 9) msg.innerText = "¡Excelente! Eres un maestro de la lengua.";
        else if(nota >= 7) msg.innerText = "¡Muy bien! Tienes un gran dominio del temario.";
        else if(nota >= 5) msg.innerText = "Aprobado. Repasa los fallos para mejorar.";
        else msg.innerText = "Debes estudiar más. ¡Inténtalo de nuevo!";
    }

    initQuiz();
</script>

</body>
</html>
