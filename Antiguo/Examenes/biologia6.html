<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNIDAD 6: LOS INVERTEBRADOS - EXAMEN FINAL</title>
    <style>
        :root { --p: #0277bd; --s: #4fc3f7; --bg: #e1f5fe; --txt: #01579b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        #container { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid var(--p); }
        .q-card { margin-bottom: 20px; }
        .tag { display: inline-block; background: #ffcc80; color: #e65100; padding: 4px 8px; border-radius: 5px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
        .btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; cursor: pointer; background: none; transition: 0.3s; font-size: 1.05em; font-weight: 500; }
        .btn:hover:not(:disabled) { border-color: var(--s); background: #f0faff; }
        .btn:disabled { cursor: default; opacity: 0.7; }
        
        #feedback { display: none; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .correct-box { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
        .wrong-box { background: #ffebee; color: #c62828; border: 2px solid #c62828; }
        
        .next-btn { background: var(--p); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 1.1em; font-weight: bold; width: 100%; }
        .next-btn:hover { background: #01579b; }
        
        h1 { color: var(--p); text-align: center; }
        .progress { height: 12px; background: #eee; border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
        #bar { height: 100%; background: var(--p); width: 0%; transition: 0.5s; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; color: var(--p); margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="container">
    <h1>🐙 Unidad 6: Invertebrados</h1>
    <div class="stats">
        <span id="q-count">Pregunta: 1 / 20</span>
        <span id="score-count">Nota: 0.0</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    
    <div id="game">
        <div id="question-area"></div>
        <div id="feedback">
            <div id="f-msg"></div>
            <button class="next-btn" onclick="nextQuestion()">Siguiente Pregunta ➔</button>
        </div>
    </div>
    
    <div id="result" style="display:none; text-align: center;">
        <h2 id="final-score-title" style="font-size: 2.5em; color: var(--p); margin-bottom:10px;"></h2>
        <p id="final-msg" style="font-size: 1.2em;"></p>
        <button class="next-btn" onclick="location.reload()">Repasar de nuevo</button>
    </div>
</div>

<script>
    const bank = [
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> ¿Cómo se denominan las células exclusivas de los Poríferos (esponjas) que tienen un flagelo y sirven para filtrar el agua?", opts: ["Cnidocitos", "Coanocitos", "Quetas", "Espongina"], ans: 1, info: "¡Muy importante! Los coanocitos recubren el interior de la esponja y crean corrientes para atrapar alimento." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> El esqueleto de algunas esponjas está formado por fibras flexibles de una proteína llamada:", opts: ["Quitina", "Celulosa", "Espongina", "Queratina"], ans: 2, info: "La espongina es lo que forma las esponjas de baño naturales." },
        { q: "<span class='tag'>COMPLETAR TEXTO</span> En los poríferos, el agua entra por los poros hacia la cavidad central llamada ________ y sale por un gran orificio superior llamado ________.", opts: ["Ósculo / Atrio", "Atrio / Ósculo", "Sifón / Rádula", "Estómago / Boca"], ans: 1, info: "La cavidad es el Atrio, y el orificio de salida es el Ósculo." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> Las células urticantes (venenosas) exclusivas de los tentáculos de las medusas y pólipos se llaman:", opts: ["Cnidocitos", "Coanocitos", "Quelíceros", "Clitelo"], ans: 0, info: "De ahí viene el nombre del grupo: Cnidarios." },
        { q: "<span class='tag'>DIFERENCIAS</span> ¿Qué diferencia principal hay entre una Medusa y un Pólipo?", opts: ["La medusa es de agua dulce y el pólipo marino.", "El pólipo tiene vida libre y la medusa vive fija.", "El pólipo vive fijo al sustrato (sésil) y la medusa tiene vida libre.", "El pólipo es vertebrado y la medusa invertebrada."], ans: 2, info: "Los corales o anémonas son pólipos (fijos, tentáculos hacia arriba). Las medusas nadan (tentáculos hacia abajo)." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> La cabeza de la Tenia (un platelminto parásito) provista de ganchos y ventosas para fijarse al intestino se denomina:", opts: ["Rádula", "Escólex", "Palpo", "Sifón"], ans: 1, info: "El escólex le permite anclarse firmemente al hospedador." },
        { q: "<span class='tag'>DIFERENCIAS</span> ¿En qué se diferencia el cuerpo de un Anélido (como la lombriz) del de un Nematodo?", opts: ["El anélido es cilíndrico y liso, el nematodo es plano.", "El anélido tiene el cuerpo dividido en anillos (segmentado) y el nematodo no.", "El nematodo tiene caparazón duro.", "No hay diferencias, ambos son platelmintos."], ans: 1, info: "Anélido viene de 'anillo'. Los nematodos son gusanos cilíndricos no segmentados." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> El anillo engrosado que tienen las lombrices de tierra (anélidos), encargado de formar el capullo para los huevos, es el:", opts: ["Clitelo", "Escólex", "Ósculo", "Manto"], ans: 0, info: "Es vital para su reproducción." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> Los pequeños filamentos rígidos que usan los anélidos marinos y terrestres para desplazarse y anclarse se llaman:", opts: ["Pies ambulacrales", "Tentáculos", "Quetas o sedas", "Antenas"], ans: 2, info: "Las quetas son como pequeñas cerdas de un cepillo." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> La lengua con pequeños dientes de quitina que usan los moluscos gasterópodos (caracoles) para raspar el alimento es la:", opts: ["Rádula", "Espongina", "Pluma", "Mandíbula"], ans: 0, info: "Funciona como una pequeña lija." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> La concha interna residual que tienen los calamares (moluscos cefalópodos) se conoce como:", opts: ["Valva", "Rádula", "Pluma", "Clitelo"], ans: 2, info: "Es una lámina transparente de quitina en su interior." },
        { q: "<span class='tag'>DIFERENCIAS MOLUSCOS</span> Según el mapa conceptual de los Moluscos: un animal con dos conchas articuladas que se alimenta filtrando agua (ej: mejillón) es un:", opts: ["Gasterópodo", "Cefalópodo", "Bivalvo", "Crustáceo"], ans: 2, info: "Los bivalvos no tienen cabeza diferenciada ni rádula, son filtradores." },
        { q: "<span class='tag'>TÉRMINOS INSECTOS</span> En la metamorfosis de los insectos, las fases son: Huevo -> Larva (oruga) -> ________ (capullo) -> Adulto.", opts: ["Ninfa", "Pupa", "Queta", "Clitelo"], ans: 1, info: "La fase de encierro y transformación profunda es la Pupa (o crisálida). La ninfa es la cría en la metamorfosis incompleta." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> Los apéndices en forma de uña o pinza que tienen las arañas en la boca para inyectar veneno son los:", opts: ["Quelíceros", "Palpos", "Antenas", "Cnidocitos"], ans: 0, info: "Los arácnidos son el grupo de artrópodos 'quelicerados'." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> Los apéndices sensoriales (similares a patas cortas) que tienen las arañas al lado de la boca para manipular el alimento son los:", opts: ["Palpos (o pedipalpos)", "Quelíceros", "Sifones", "Quetas"], ans: 0, info: "No se deben confundir con los quelíceros (veneno)." },
        { q: "<span class='tag'>DIFERENCIAS INSECTOS</span> ¿Cuál de estas características distingue a un INSECTO de un Arácnido?", opts: ["El insecto tiene 8 patas, el arácnido 6.", "El insecto tiene 3 pares de patas (6) y cuerpo en 3 partes; el arácnido tiene 4 pares (8) y cuerpo en 2 partes.", "Los insectos no tienen antenas.", "Los arácnidos tienen alas."], ans: 1, info: "Regla de oro: Insectos = 6 patas. Arácnidos = 8 patas." },
        { q: "<span class='tag'>TÉRMINO ESPECÍFICO</span> El sistema de tubos llenos de agua exclusivo de los Equinodermos (estrellas de mar), que usan para moverse mediante pies con ventosas, es el:", opts: ["Sistema traqueal", "Sistema ambulacral", "Aparato radular", "Manto"], ans: 1, info: "Los pies ambulacrales les permiten caminar y atrapar alimento." },
        { q: "<span class='tag'>CLASIFICACIÓN COMPLETA</span> Clasifica este ser vivo: CANGREJO.", opts: ["Reino Animal. Invertebrado. Molusco.", "Reino Animal. Invertebrado. Artrópodo Arácnido.", "Reino Animal. Invertebrado. Artrópodo Crustáceo.", "Reino Animal. Equinodermo."], ans: 2, info: "Tiene exoesqueleto y patas articuladas (Artrópodo), 5 pares de patas y respira por branquias (Crustáceo)." },
        { q: "<span class='tag'>CLASIFICACIÓN COMPLETA</span> Clasifica este ser vivo: ABEJA.", opts: ["R. Animal. Invertebrado. Artrópodo Insecto.", "R. Animal. Invertebrado. Artrópodo Miriápodo.", "R. Animal. Invertebrado. Artrópodo Crustáceo.", "R. Animal. Vertebrado."], ans: 0, info: "Artrópodo porque tiene patas articuladas. Insecto porque tiene 6 patas y alas." },
        { q: "<span class='tag'>CLASIFICACIÓN COMPLETA</span> Clasifica este ser vivo: CARACOL DE TIERRA.", opts: ["R. Animal. Invertebrado. Molusco Gasterópodo.", "R. Animal. Invertebrado. Molusco Bivalvo.", "R. Animal. Invertebrado. Anélido.", "R. Animal. Invertebrado. Artrópodo."], ans: 0, info: "Cuerpo blando protegido por una sola concha espiral (Gasterópodo)." }
    ];

    let cur = 0, score = 0;
    
    function render() {
        const d = bank[cur];
        document.getElementById('q-count').innerText = `Pregunta: ${cur + 1} / ${bank.length}`;
        document.getElementById('bar').style.width = ((cur) / bank.length) * 100 + "%";
        
        let html = `<div class="q-card"><h3>${d.q}</h3>`;
        d.opts.forEach((o, i) => {
            html += `<button class="btn" onclick="checkAnswer(${i})">${o}</button>`;
        });
        html += `</div>`;
        
        document.getElementById('question-area').innerHTML = html;
        document.getElementById('feedback').style.display = 'none';
    }
    
    window.checkAnswer = (i) => {
        const d = bank[cur];
        const feedbackDiv = document.getElementById('feedback');
        const msgDiv = document.getElementById('f-msg');
        
        if(i === d.ans) { 
            score += 0.5; 
            feedbackDiv.className = "correct-box"; 
            msgDiv.innerHTML = "<strong>¡CORRECTO! 🦐</strong><br><p style='font-weight:normal; margin-top:10px;'>" + d.info + "</p>"; 
        } else { 
            feedbackDiv.className = "wrong-box"; 
            msgDiv.innerHTML = "<strong>INCORRECTO 🦂</strong><br><p style='font-weight:normal; margin-top:10px;'>La respuesta correcta era: <b>" + d.opts[d.ans] + "</b>.<br>" + d.info + "</p>"; 
        }
        
        feedbackDiv.style.display = "block";
        document.getElementById('score-count').innerText = `Nota: ${score.toFixed(1)}`;
        
        // Deshabilitar botones para evitar múltiples clics
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(b => b.disabled = true);
    };
    
    window.nextQuestion = () => {
        cur++;
        if(cur < bank.length) {
            render();
        } else {
            showResults();
        }
    };

    function showResults() {
        document.getElementById('game').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('bar').style.width = "100%";
        
        let final = score.toFixed(1);
        document.getElementById('final-score-title').innerText = "Nota Final: " + final;
        document.getElementById('final-msg').innerText = final >= 5 ? "¡Excelente! Has dominado los invertebrados." : "Aún quedan algunos conceptos por afianzar. Revisa los apuntes y vuelve a intentar el test.";
    }

    // Iniciar
    render();
</script>
</body>
</html>
